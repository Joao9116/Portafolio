<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio Personal - Joao León</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo">Portafolio</a>
    <nav class="page-dots" aria-label="Indicador de página">
      <a href="index.html" class="dot active" title="Página 1: Inicio">1</a>
      <a href="pagina2.html" class="dot" title="Página 2: Información">2</a>
      <a href="pagina3.html" class="dot" title="Página 3: Intereses">3</a>
    </nav>
  </header>

  <main>
    <section class="hero-container reveal">
      <div class="hero-info">
        <h1>Joao León</h1>
        <h2 id="typingSubtitle" data-text="Estudiante de Desarrollo de Software">Estudiante de Desarrollo de Software</h2>
        <p>Bienvenido a mi portafolio digital personal.</p>
      </div>

      <!-- Cuadro para la foto a la derecha -->
      <div class="photo-box photo-zoomable" data-caption="Joao León">
        <img src="joao.jpg" alt="Foto de Joao">
      </div>
    </section>

    <!-- Flecha para la siguiente página/apartado -->
    <div class="nav-arrow-container reveal">
      <a href="pagina2.html" class="btn">
        Siguiente &rarr;
      </a>
    </div>
  </main>

  <footer>
    <p>&copy; <span class="current-year">2026</span> | Desarrollo de Software</p>
  </footer>

  <!-- Visor Lightbox para ampliar fotos al hacer clic -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightboxClose" aria-label="Cerrar">&times;</button>
    <img id="lightboxImg" src="" alt="Vista ampliada">
    <p id="lightboxCaption"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
