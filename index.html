<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio Personal</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* CABECERA: Solo el título Portafolio */
    header {
      background-color: var(--bg-card);
      padding: 1.2rem 2rem;
      border-bottom: 2px solid var(--accent);
    }

    .logo {
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--accent);
      letter-spacing: 1px;
    }

    /* CONTENEDOR PRINCIPAL CON FLEXBOX */
    main {
      flex: 1;
      max-width: 1000px;
      margin: auto;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
    }

    /* PRIMERA CARA: Información personal y cuadro para foto con Flexbox */
    .hero-container {
      display: flex;
      flex-wrap: wrap;
      background-color: var(--bg-card);
      border-radius: 14px;
      padding: 40px;
      gap: 40px;
      align-items: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      border-left: 6px solid var(--accent);
    }

    .hero-info {
      flex: 1 1 350px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .hero-info h1 {
      font-size: 2.5rem;
      color: var(--accent);
    }

    .hero-info h2 {
      font-size: 1.2rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .hero-info p {
      color: var(--text-muted);
      line-height: 1.6;
      font-size: 1rem;
    }

    /* CUADRO PARA LA FOTO A LA DERECHA */
    .photo-box {
      flex: 0 0 240px;
      height: 280px;
      background-color: #0f172a;
      border: 2px dashed var(--accent);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      padding: 20px;
      gap: 10px;
    }

    .photo-box span {
      font-size: 0.85rem;
    }

    /* FLECHA DE NAVEGACIÓN HACIA EL SIGUIENTE APARTADO */
    .nav-arrow-container {
      display: flex;
      justify-content: flex-end;
      margin-top: 30px;
    }

    .next-btn {
      background-color: var(--accent);
      color: var(--bg-primary);
      padding: 12px 24px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.2s, background-color 0.2s;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }

    .next-btn:hover {
      transform: translateY(-4px);
      background-color: #7dd3fc;
    }

    /* FOOTER */
    footer {
      background-color: var(--bg-card);
      padding: 15px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Portafolio</div>
  </header>

  <main>
    <section class="hero-container">
      <div class="hero-info">
        <h1>Joao León</h1>
        <h2>Estudiante de Desarrollo de Software</h2>
        <p>Bienvenido a mi portafolio digital personal.</p>
      </div>

      <!-- Cuadro para la foto a la derecha -->
      <div class="photo-box"style="padding: 0; overflow: hidden;">
        <img src="joao.jpg" alt="Foto de Joao" style="width: 100%; height: 100%; object-fit: cover;">
      </div>
    </section>

    <!-- Flecha para la siguiente página/apartado -->
    <div class="nav-arrow-container">
      <a href="pagina2.html" class="next-btn">
        Siguiente &rarr;
      </a>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 | Desarrollo de Software</p>
  </footer>

</body>
</html>
